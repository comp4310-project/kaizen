name: Research
description: Something to look into — papers, existing tools, or a quick experiment.
title: "[Research]: "
labels: ["research"]
body:
  - type: textarea
    id: question
    attributes:
      label: What are we trying to find out?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What does the answer unblock?
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: e.g. 3 hours
    validations:
      required: false
