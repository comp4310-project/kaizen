name: Task
description: A unit of work for a course deliverable.
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
      placeholder: Describe the work concretely enough that someone else could pick it up.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How do we know this is finished?
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: deliverable
    attributes:
      label: Deliverable
      options: ["P0", "P1", "P2", "P3", "P4", "P5", "Not deliverable-specific"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, blockers, dependencies
    validations:
      required: false
