name: Feature
description: Something the system should do.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve, and for who?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["frontend", "backend", "ml", "data", "docs", "not sure"]
    validations:
      required: true
